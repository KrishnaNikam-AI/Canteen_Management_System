{% extends "base.html" %}
{% block title %}Menu Items – Canteen Management System{% endblock %}
{% block page_title %}Menu Items{% endblock %}
{% block page_sub %}Catalog & pricing management{% endblock %}

{% block content %}
<div class="filter-bar">
  <div class="filter-group">
    <label>Search</label>
    <input id="searchInput" class="form-control" placeholder="Name or category…" oninput="loadItems()"/>
  </div>
  <div class="filter-group">
    <label>Category</label>
    <select id="filterCat" class="form-control" onchange="loadItems()">
      <option value="">All Categories</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Availability</label>
    <select id="filterAvail" class="form-control" onchange="loadItems()">
      <option value="">All</option>
      <option value="1">Available</option>
      <option value="0">Unavailable</option>
    </select>
  </div>
  <div style="margin-top:auto">
    <button class="btn btn-primary" onclick="openAddModal()">➕ Add Item</button>
  </div>
</div>

<div class="table-wrap">
  <div class="table-header">
    <h3>Menu Catalog</h3>
    <span class="text-muted fs-12" id="countLabel"></span>
  </div>
  <div id="tableBody"><div style="padding:32px;text-align:center;color:var(--text-muted)">Loading…</div></div>
</div>
{% endblock %}

{% block scripts %}
<script>
let allItems = [], allCats = [];

async function init() {
  allCats = await api('GET', '/api/categories');
  const sel = document.getElementById('filterCat');
  allCats.forEach(c => sel.add(new Option(c.category_name, c.category_id)));
  await loadItems();
}

async function loadItems() {
  try {
    const q   = document.getElementById('searchInput').value;
    const cat = document.getElementById('filterCat').value;
    const av  = document.getElementById('filterAvail').value;
    let url = '/api/menu-items?';
    if (q)   url += `q=${encodeURIComponent(q)}&`;
    if (cat) url += `category_id=${cat}&`;
    if (av !== '') url += `available=${av}`;
    allItems = await api('GET', url);
    document.getElementById('countLabel').textContent = allItems.length + ' items';

    const cols = [
      { key: 'item_id',       label: '#', render: v => `<span class="text-muted fs-12">${v}</span>` },
      { key: 'item_name',     label: 'Item Name', render: v => `<strong>${v}</strong>` },
      { key: 'category_name', label: 'Category' },
      { key: 'price',         label: 'Price', render: v => `<span class="fw-700 text-primary-c">₹${parseFloat(v).toFixed(2)}</span>` },
      { key: 'description',   label: 'Description', render: v => `<span class="text-muted fs-12">${v||'—'}</span>` },
      { key: 'is_available',  label: 'Status', render: v => v ? `<span class="badge badge-active">Available</span>` : `<span class="badge badge-inactive">Unavailable</span>` },
    ];
    document.getElementById('tableBody').innerHTML = buildTable(cols, allItems, r => `
      <button class="btn btn-ghost btn-sm" onclick="openEditModal(${r.item_id})">✏️ Edit</button>
      <button class="btn btn-danger btn-sm" style="margin-left:6px" onclick="deleteItem(${r.item_id},'${r.item_name}')">🗑️</button>
    `);
  } catch (e) { showToast(e.message, 'error'); }
}

function catOptions(selId = '') {
  return allCats.map(c =>
    `<option value="${c.category_id}" ${c.category_id == selId ? 'selected' : ''}>${c.category_name}</option>`
  ).join('');
}

function openAddModal() {
  openModal('Add Menu Item', `
    <div class="form-group">
      <label class="form-label">Item Name *</label>
      <input id="fName" class="form-control" placeholder="e.g. Veg Burger"/>
    </div>
    <div class="form-group">
      <label class="form-label">Category *</label>
      <select id="fCat" class="form-control"><option value="">Select…</option>${catOptions()}</select>
    </div>
    <div class="form-group">
      <label class="form-label">Price (₹) *</label>
      <input id="fPrice" class="form-control" type="number" step="0.01" placeholder="0.00"/>
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea id="fDesc" class="form-control" rows="2"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Availability</label>
      <select id="fAvail" class="form-control"><option value="1">Available</option><option value="0">Unavailable</option></select>
    </div>
  `, `
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveItem()">💾 Save</button>
  `);
}

function openEditModal(id) {
  const it = allItems.find(x => x.item_id === id);
  if (!it) return;
  openModal('Edit Menu Item', `
    <input type="hidden" id="fId" value="${id}"/>
    <div class="form-group">
      <label class="form-label">Item Name *</label>
      <input id="fName" class="form-control" value="${it.item_name}"/>
    </div>
    <div class="form-group">
      <label class="form-label">Category *</label>
      <select id="fCat" class="form-control">${catOptions(it.category_id)}</select>
    </div>
    <div class="form-group">
      <label class="form-label">Price (₹) *</label>
      <input id="fPrice" class="form-control" type="number" step="0.01" value="${it.price}"/>
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea id="fDesc" class="form-control" rows="2">${it.description||''}</textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Availability</label>
      <select id="fAvail" class="form-control">
        <option value="1" ${it.is_available ? 'selected' : ''}>Available</option>
        <option value="0" ${!it.is_available ? 'selected' : ''}>Unavailable</option>
      </select>
    </div>
  `, `
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveItem(true)">💾 Update</button>
  `);
}

async function saveItem(isEdit = false) {
  const payload = {
    item_name: document.getElementById('fName').value.trim(),
    category_id: document.getElementById('fCat').value,
    price: document.getElementById('fPrice').value,
    description: document.getElementById('fDesc').value.trim(),
    is_available: document.getElementById('fAvail').value,
  };
  try {
    if (isEdit) {
      await api('PUT', `/api/menu-items/${document.getElementById('fId').value}`, payload);
      showToast('Item updated!', 'success');
    } else {
      await api('POST', '/api/menu-items', payload);
      showToast('Item added!', 'success');
    }
    closeModal(); await loadItems();
  } catch (e) { showToast(e.message, 'error'); }
}

async function deleteItem(id, name) {
  openModal('Confirm Delete', `<p>Delete <strong>${name}</strong> from the menu?</p>`, `
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-danger" onclick="confirmDeleteItem(${id})">🗑️ Delete</button>
  `);
}

async function confirmDeleteItem(id) {
  try {
    await api('DELETE', `/api/menu-items/${id}`);
    showToast('Deleted!', 'success'); closeModal(); await loadItems();
  } catch (e) { showToast(e.message, 'error'); }
}

document.addEventListener('DOMContentLoaded', init);
</script>
{% endblock %}
